openapi: 3.1.0
info:
  title: Array round-trip
  version: 1.0.0
paths:
  /pets/batch:
    post:
      operationId: createPets
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required: [id, name]
