openapi: 3.1.0
info:
  title: GET with query params
  version: 1.0.0
paths:
  /search:
    get:
      operationId: search
      tags: [items]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
