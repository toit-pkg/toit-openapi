openapi: 3.1.0
info:
  title: Model named like the client class
  version: 1.0.0
paths:
  /status:
    get:
      operationId: getStatus
      tags: [items]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api'
components:
  schemas:
    Api:
      type: object
      required: [version]
      properties:
        version:
          type: string
